[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnforge-support-bot"
version = "0.1.0"
description = "Grounded customer support assistant for the LearnForge take-home assignment"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "groq>=0.11.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.2.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[project.scripts]
learnforge-index = "learnforge_support.ingestion:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
